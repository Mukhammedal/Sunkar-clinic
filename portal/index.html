<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedClinic — Панель управления</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { background: #0f1117; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 10px; }

    /* Animations */
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.2)} }
    .pulse-dot { animation: pulse-dot 2s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Sidebar */
    .sidebar { background: #13151f; border-right: 1px solid #1e2130; }
    .nav-item { color: #8892a4; transition: all 0.15s; border-radius: 10px; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
    .nav-item.active { background: rgba(99,102,241,0.15); color: #818cf8; }
    .nav-item.active svg { color: #818cf8; }

    /* Cards */
    .glass-card {
      background: #1a1d2e;
      border: 1px solid #1e2130;
      border-radius: 16px;
    }
    .stat-card {
      background: linear-gradient(135deg, #1a1d2e 0%, #1e2130 100%);
      border: 1px solid #252840;
      border-radius: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: #3d4166; }

    /* Table */
    .data-table thead { background: rgba(255,255,255,0.03); }
    .data-table thead th { color: #4a5568; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .data-table tbody tr { border-bottom: 1px solid #1a1d2e; transition: background 0.1s; }
    .data-table tbody tr:hover { background: rgba(255,255,255,0.03); }
    .data-table tbody td { color: #9ca3af; }

    /* Badges */
    .badge { display:inline-flex; align-items:center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-scheduled { background: rgba(99,102,241,0.15); color: #818cf8; }
    .badge-confirmed  { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge-cancelled  { background: rgba(239,68,68,0.12);  color: #f87171; }
    .badge-completed  { background: rgba(107,114,128,0.15); color: #9ca3af; }
    .badge-active     { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-transfer   { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-failed     { background: rgba(239,68,68,0.12);  color: #f87171; }

    /* Inputs */
    .dark-input {
      background: #0f1117; border: 1px solid #1e2130; color: #e2e8f0;
      border-radius: 10px; padding: 8px 12px; font-size: 13px; outline: none;
      transition: border-color 0.15s;
    }
    .dark-input:focus { border-color: #6366f1; }
    .dark-input::placeholder { color: #4a5568; }
    select.dark-input option { background: #1a1d2e; }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white; padding: 9px 18px; border-radius: 10px;
      font-weight: 600; font-size: 13px; transition: all 0.2s;
      border: none; cursor: pointer;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .btn-ghost { background: rgba(255,255,255,0.06); color: #9ca3af; padding: 8px 14px; border-radius: 10px; font-size: 13px; border: none; cursor: pointer; transition: all 0.15s; }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }

    /* Modal */
    .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    .modal-content { background: #1a1d2e; border: 1px solid #252840; border-radius: 20px; }

    /* Doctor card */
    .doctor-card { background: #1a1d2e; border: 1px solid #1e2130; border-radius: 16px; transition: all 0.2s; }
    .doctor-card:hover { border-color: #3d4166; transform: translateY(-2px); }

    /* Gradient texts */
    .gradient-text { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Logo glow */
    .logo-glow { box-shadow: 0 0 20px rgba(99,102,241,0.3); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const api = async (path, options = {}) => {
  const res = await fetch(`/api/portal${path}`, {
    headers: { 'Content-Type': 'application/json' }, ...options,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
};

// ── Icons ────────────────────────────────────────────────────────────────────
const icons = {
  dashboard: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
  patients:  "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z",
  calendar:  "M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z",
  doctors:   "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4",
  phone:     "M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z",
  settings:  "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z",
  search:    "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
  plus:      "M12 4v16m8-8H4",
  check:     "M5 13l4 4L19 7",
  x:         "M6 18L18 6M6 6l12 12",
  edit:      "M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z",
  chevron:   "M9 5l7 7-7 7",
  activity:  "M22 12h-4l-3 9L9 3l-3 9H2",
  trend:     "M13 7h8m0 0v8m0-8l-8 8-4-4-6 6",
  clock:     "M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z",
  bell:      "M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9",
  trash:     "M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16",
};
const Ico = ({ n, s=18, cls="" }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} fill="none"
    viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8} className={cls}>
    <path strokeLinecap="round" strokeLinejoin="round" d={icons[n]} />
  </svg>
);

// ── Helpers ───────────────────────────────────────────────────────────────────
const Badge = ({ status }) => {
  const map = { scheduled:"Запланировано", confirmed:"Подтверждено", cancelled:"Отменено",
    completed:"Завершено", active:"Активен", transfer:"Оператор", failed:"Ошибка" };
  return <span className={`badge badge-${status}`}>{map[status]||status}</span>;
};

const Spinner = () => (
  <div className="flex items-center justify-center h-48">
    <div className="w-7 h-7 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full spin"></div>
  </div>
);

const Modal = ({ title, children, onClose }) => (
  <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
    <div className="modal-content w-full max-w-lg max-h-[88vh] overflow-y-auto fade-in">
      <div className="flex items-center justify-between px-6 py-4 border-b border-white/5">
        <h2 className="font-semibold text-white">{title}</h2>
        <button onClick={onClose} className="text-gray-500 hover:text-gray-300 transition-colors">
          <Ico n="x" s={18} />
        </button>
      </div>
      <div className="p-6">{children}</div>
    </div>
  </div>
);

const InfoRow = ({ label, value }) => (
  <div className="flex items-center justify-between py-2.5 border-b border-white/5 last:border-0">
    <span className="text-gray-500 text-sm">{label}</span>
    <span className="text-gray-200 text-sm font-medium">{value}</span>
  </div>
);

const fmtDate = (s, opts) => new Date(s).toLocaleString("ru", opts||{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

// ── Stat Card ─────────────────────────────────────────────────────────────────
const StatCard = ({ title, value, icon, gradient, sub, delta }) => (
  <div className="stat-card p-5 fade-in">
    <div className="flex items-start justify-between mb-4">
      <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${gradient}`}>
        <Ico n={icon} s={18} cls="text-white" />
      </div>
      {delta !== undefined && (
        <span className={`text-xs font-medium px-2 py-1 rounded-full ${delta >= 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
          {delta >= 0 ? '↑' : '↓'} {Math.abs(delta)}%
        </span>
      )}
    </div>
    <p className="text-gray-400 text-xs font-medium mb-1">{title}</p>
    <p className="text-white text-3xl font-bold">{value}</p>
    {sub && <p className="text-gray-500 text-xs mt-1">{sub}</p>}
  </div>
);

// ── Dashboard ─────────────────────────────────────────────────────────────────
const Dashboard = () => {
  const [data, setData] = useState(null);
  const chartRef = useRef(null);
  const chartInst = useRef(null);

  useEffect(() => { api("/dashboard").then(setData).catch(console.error); }, []);

  useEffect(() => {
    if (!data || !chartRef.current) return;
    if (chartInst.current) chartInst.current.destroy();
    const ctx = chartRef.current.getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 0, 200);
    grad.addColorStop(0, "rgba(99,102,241,0.5)");
    grad.addColorStop(1, "rgba(99,102,241,0)");
    chartInst.current = new Chart(chartRef.current, {
      type: "bar",
      data: {
        labels: Array.from({length:24}, (_,i) => `${i}`),
        datasets: [{
          data: data.calls_by_hour,
          backgroundColor: grad,
          borderColor: "rgba(99,102,241,0.8)",
          borderWidth: 1,
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display:false }, tooltip: {
          backgroundColor: "#1a1d2e", titleColor: "#9ca3af",
          bodyColor: "#e2e8f0", borderColor: "#252840", borderWidth: 1,
          callbacks: { title: (i) => `${i[0].label}:00`, label: (i) => ` ${i.raw} звонков` }
        }},
        scales: {
          x: { grid: { color:"rgba(255,255,255,0.03)" }, ticks: { color:"#4a5568", font:{size:11} } },
          y: { grid: { color:"rgba(255,255,255,0.03)" }, ticks: { color:"#4a5568", stepSize:1 }, beginAtZero:true }
        }
      }
    });
  }, [data]);

  if (!data) return <Spinner />;
  const { stats, recent_calls, upcoming_appointments } = data;

  return (
    <div className="fade-in space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-white">Панель управления</h1>
          <p className="text-gray-500 text-sm mt-0.5">
            {new Date().toLocaleDateString("ru",{weekday:"long",day:"numeric",month:"long"})}
          </p>
        </div>
        <button onClick={() => window.location.reload()} className="btn-ghost flex items-center gap-2">
          <Ico n="activity" s={15}/> Обновить
        </button>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard title="Звонков сегодня" value={stats.calls_today}       icon="phone"    gradient="bg-gradient-to-br from-indigo-500 to-indigo-700" />
        <StatCard title="Записей создано"  value={stats.appointments_today} icon="calendar" gradient="bg-gradient-to-br from-emerald-500 to-emerald-700" />
        <StatCard title="На оператора"     value={stats.transfers_today}    icon="activity" gradient="bg-gradient-to-br from-amber-500 to-amber-700" />
        <StatCard title="Всего пациентов"  value={stats.total_patients}     icon="patients" gradient="bg-gradient-to-br from-purple-500 to-purple-700" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="glass-card p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-white font-semibold">Активность звонков</h2>
              <p className="text-gray-500 text-xs mt-0.5">По часам за сегодня</p>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
              <span className="text-gray-500 text-xs">Звонки</span>
            </div>
          </div>
          <div style={{height:180}}>
            <canvas ref={chartRef}></canvas>
          </div>
        </div>

        <div className="glass-card p-5">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-white font-semibold">Записи сегодня</h2>
            <span className="badge badge-active text-xs">{upcoming_appointments.length}</span>
          </div>
          {upcoming_appointments.length === 0
            ? <div className="flex flex-col items-center justify-center h-36 text-gray-600">
                <Ico n="calendar" s={28} cls="mb-2 opacity-30"/>
                <p className="text-sm">Нет записей</p>
              </div>
            : <div className="space-y-2 overflow-y-auto" style={{maxHeight:180}}>
                {upcoming_appointments.map(a => (
                  <div key={a.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/3 hover:bg-white/5 transition-colors">
                    <div className="w-14 shrink-0 text-center bg-indigo-500/10 rounded-lg py-1.5">
                      <span className="text-indigo-400 text-xs font-bold">
                        {new Date(a.appointment_datetime).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}
                      </span>
                    </div>
                    <div className="min-w-0">
                      <p className="text-gray-200 text-sm font-medium truncate">{a.patients?.full_name||"—"}</p>
                      <p className="text-gray-500 text-xs truncate">{a.doctors?.specialization_ru}</p>
                    </div>
                  </div>
                ))}
              </div>
          }
        </div>
      </div>

      <div className="glass-card overflow-hidden">
        <div className="px-5 py-4 border-b border-white/5 flex items-center justify-between">
          <h2 className="text-white font-semibold">Последние звонки</h2>
          <span className="text-gray-500 text-xs">{recent_calls.length} записей</span>
        </div>
        <table className="w-full data-table">
          <thead><tr>
            {["Телефон","Время","Язык","Состояние","Статус"].map(h=>(
              <th key={h} className="p-4 text-left font-medium">{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {recent_calls.map(c => (
              <tr key={c.id}>
                <td className="p-4 font-mono text-gray-300 text-sm">{c.phone}</td>
                <td className="p-4 text-sm">{fmtDate(c.started_at)}</td>
                <td className="p-4 text-sm uppercase">{c.language||"—"}</td>
                <td className="p-4 text-sm">
                  <code className="bg-white/5 text-indigo-300 px-2 py-0.5 rounded text-xs">{c.state||"—"}</code>
                </td>
                <td className="p-4"><Badge status={c.status}/></td>
              </tr>
            ))}
            {!recent_calls.length && (
              <tr><td colSpan={5} className="p-10 text-center text-gray-600 text-sm">Нет данных</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ── Patients ──────────────────────────────────────────────────────────────────
const Patients = () => {
  const [patients, setPatients] = useState([]);
  const [total, setTotal] = useState(0);
  const [search, setSearch] = useState("");
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [detail, setDetail] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const r = await api(`/patients?search=${encodeURIComponent(search)}`);
      setPatients(r.patients); setTotal(r.total);
    } finally { setLoading(false); }
  }, [search]);

  useEffect(() => { load(); }, [load]);

  const open = async (p) => {
    setSelected(p); setDetail(null);
    const d = await api(`/patients/${p.id}`);
    setDetail(d);
  };

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-white">Пациенты</h1>
          <p className="text-gray-500 text-sm mt-0.5">Всего: {total}</p>
        </div>
      </div>

      <div className="glass-card p-3">
        <div className="relative">
          <Ico n="search" s={15} cls="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500"/>
          <input className="dark-input w-full pl-9" placeholder="Поиск по имени или телефону..."
            value={search} onChange={e=>setSearch(e.target.value)} />
        </div>
      </div>

      <div className="glass-card overflow-hidden">
        <table className="w-full data-table">
          <thead><tr>
            {["Пациент","Телефон","Язык","Дата регистрации",""].map(h=>(
              <th key={h} className="p-4 text-left font-medium">{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {loading
              ? <tr><td colSpan={5} className="py-12 text-center"><Spinner/></td></tr>
              : patients.map(p => (
                <tr key={p.id} className="cursor-pointer" onClick={()=>open(p)}>
                  <td className="p-4">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-indigo-500/10 flex items-center justify-center shrink-0">
                        <span className="text-indigo-400 text-xs font-bold">
                          {(p.full_name||"?")[0].toUpperCase()}
                        </span>
                      </div>
                      <span className="text-gray-200 font-medium text-sm">{p.full_name||<em className="text-gray-600">Не указано</em>}</span>
                    </div>
                  </td>
                  <td className="p-4 font-mono text-sm">{p.phone}</td>
                  <td className="p-4 text-sm uppercase">{p.language||"ru"}</td>
                  <td className="p-4 text-sm">{new Date(p.created_at).toLocaleDateString("ru")}</td>
                  <td className="p-4"><Ico n="chevron" s={15} cls="text-gray-600"/></td>
                </tr>
              ))
            }
            {!loading && !patients.length && (
              <tr><td colSpan={5} className="p-12 text-center text-gray-600">Пациенты не найдены</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {selected && (
        <Modal title={selected.full_name||"Пациент"} onClose={()=>{setSelected(null);setDetail(null);}}>
          <div className="space-y-1 mb-5">
            <InfoRow label="Телефон" value={<span className="font-mono">{selected.phone}</span>} />
            <InfoRow label="Язык" value={(selected.language||"ru").toUpperCase()} />
            <InfoRow label="Регистрация" value={new Date(selected.created_at).toLocaleDateString("ru")} />
          </div>
          <h3 className="text-white font-semibold mb-3 text-sm">История записей</h3>
          {!detail ? <Spinner/> : !detail.appointments.length
            ? <p className="text-gray-600 text-sm text-center py-4">Нет записей</p>
            : <div className="space-y-2">
                {detail.appointments.map(a => (
                  <div key={a.id} className="flex items-center justify-between p-3 rounded-xl bg-white/3">
                    <div>
                      <p className="text-gray-200 text-sm font-medium">{a.doctors?.full_name}</p>
                      <p className="text-gray-500 text-xs">{a.doctors?.specialization_ru}</p>
                    </div>
                    <div className="text-right">
                      <p className="text-gray-400 text-xs mb-1">{fmtDate(a.appointment_datetime)}</p>
                      <Badge status={a.status}/>
                    </div>
                  </div>
                ))}
              </div>
          }
        </Modal>
      )}
    </div>
  );
};

// ── Appointments ──────────────────────────────────────────────────────────────
const Appointments = () => {
  const [items, setItems] = useState([]);
  const [total, setTotal] = useState(0);
  const [loading, setLoading] = useState(true);
  const [df, setDf] = useState(new Date().toISOString().split("T")[0]);
  const [dt, setDt] = useState("");
  const [sf, setSf] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    try {
      let q = ""; if(df) q+=`&date_from=${df}`; if(dt) q+=`&date_to=${dt}`; if(sf) q+=`&status=${sf}`;
      const r = await api(`/appointments?limit=100${q}`);
      setItems(r.appointments); setTotal(r.total);
    } finally { setLoading(false); }
  }, [df,dt,sf]);

  useEffect(()=>{load();},[load]);

  const upd = async (id, status) => {
    try { await api(`/appointments/${id}/status`,{method:"PUT",body:JSON.stringify({status})}); load(); }
    catch(e) { alert(e.message); }
  };

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-white">Записи</h1>
          <p className="text-gray-500 text-sm mt-0.5">Найдено: {total}</p>
        </div>
      </div>

      <div className="glass-card p-4">
        <div className="flex flex-wrap gap-3">
          {[["От","date",df,setDf],["До","date",dt,setDt]].map(([l,t,v,s])=>(
            <div key={l}>
              <label className="text-gray-600 text-xs block mb-1">{l}</label>
              <input type={t} className="dark-input" value={v} onChange={e=>s(e.target.value)} />
            </div>
          ))}
          <div>
            <label className="text-gray-600 text-xs block mb-1">Статус</label>
            <select className="dark-input" value={sf} onChange={e=>setSf(e.target.value)}>
              <option value="">Все</option>
              <option value="scheduled">Запланировано</option>
              <option value="confirmed">Подтверждено</option>
              <option value="completed">Завершено</option>
              <option value="cancelled">Отменено</option>
            </select>
          </div>
        </div>
      </div>

      <div className="glass-card overflow-hidden">
        <table className="w-full data-table">
          <thead><tr>
            {["Пациент","Врач","Дата и время","Статус","Действия"].map(h=>(
              <th key={h} className="p-4 text-left font-medium">{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {loading
              ? <tr><td colSpan={5} className="py-12 text-center"><Spinner/></td></tr>
              : items.map(a=>(
                <tr key={a.id}>
                  <td className="p-4">
                    <p className="text-gray-200 font-medium text-sm">{a.patients?.full_name||"—"}</p>
                    <p className="font-mono text-gray-500 text-xs">{a.patients?.phone}</p>
                  </td>
                  <td className="p-4">
                    <p className="text-gray-300 text-sm">{a.doctors?.full_name||"—"}</p>
                    <p className="text-gray-500 text-xs">{a.doctors?.specialization_ru}</p>
                  </td>
                  <td className="p-4 text-sm text-gray-400">{fmtDate(a.appointment_datetime)}</td>
                  <td className="p-4"><Badge status={a.status}/></td>
                  <td className="p-4">
                    <div className="flex gap-1">
                      {a.status==="scheduled"&&<>
                        <button onClick={()=>upd(a.id,"confirmed")} title="Подтвердить"
                          className="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 flex items-center justify-center transition-colors">
                          <Ico n="check" s={13}/>
                        </button>
                        <button onClick={()=>upd(a.id,"cancelled")} title="Отменить"
                          className="w-7 h-7 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 flex items-center justify-center transition-colors">
                          <Ico n="x" s={13}/>
                        </button>
                      </>}
                    </div>
                  </td>
                </tr>
              ))
            }
            {!loading&&!items.length&&(
              <tr><td colSpan={5} className="p-12 text-center text-gray-600">Нет записей</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ── Doctors ───────────────────────────────────────────────────────────────────
const SPECS=[
  {v:"therapist",r:"Терапевт"},{v:"surgeon",r:"Хирург"},{v:"cardiologist",r:"Кардиолог"},
  {v:"neurologist",r:"Невролог"},{v:"pediatrician",r:"Педиатр"},{v:"gynecologist",r:"Гинеколог"},
  {v:"ophthalmologist",r:"Офтальмолог"},{v:"dermatologist",r:"Дерматолог"},{v:"endocrinologist",r:"Эндокринолог"},
];
const SPEC_COLORS=["from-indigo-500","from-emerald-500","from-rose-500","from-amber-500","from-cyan-500","from-purple-500","from-pink-500","from-teal-500","from-orange-500"];

const DoctorForm = ({ initial, onSave, onCancel }) => {
  const [f, setF] = useState(initial||{full_name:"",specialization:"therapist",specialization_ru:"Терапевт",specialization_kz:"",phone:"",work_start:"09:00",work_end:"18:00",slot_minutes:30,is_active:true});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <div className="col-span-2">
          <label className="text-gray-500 text-xs block mb-1.5">ФИО врача</label>
          <input className="dark-input w-full" value={f.full_name} onChange={e=>set("full_name",e.target.value)} placeholder="Иванов Иван Иванович"/>
        </div>
        <div>
          <label className="text-gray-500 text-xs block mb-1.5">Специальность</label>
          <select className="dark-input w-full" value={f.specialization} onChange={e=>{const s=SPECS.find(x=>x.v===e.target.value);set("specialization",e.target.value);if(s)set("specialization_ru",s.r);}}>
            {SPECS.map(s=><option key={s.v} value={s.v}>{s.r}</option>)}
          </select>
        </div>
        <div>
          <label className="text-gray-500 text-xs block mb-1.5">Телефон</label>
          <input className="dark-input w-full" value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="+7..."/>
        </div>
        <div>
          <label className="text-gray-500 text-xs block mb-1.5">Начало работы</label>
          <input type="time" className="dark-input w-full" value={f.work_start} onChange={e=>set("work_start",e.target.value)}/>
        </div>
        <div>
          <label className="text-gray-500 text-xs block mb-1.5">Конец работы</label>
          <input type="time" className="dark-input w-full" value={f.work_end} onChange={e=>set("work_end",e.target.value)}/>
        </div>
        <div>
          <label className="text-gray-500 text-xs block mb-1.5">Длина приёма</label>
          <select className="dark-input w-full" value={f.slot_minutes} onChange={e=>set("slot_minutes",Number(e.target.value))}>
            {[15,20,30,45,60].map(m=><option key={m} value={m}>{m} мин</option>)}
          </select>
        </div>
        <div className="flex items-center gap-2 mt-1">
          <input type="checkbox" id="ia" checked={f.is_active} onChange={e=>set("is_active",e.target.checked)}
            className="w-4 h-4 accent-indigo-500"/>
          <label htmlFor="ia" className="text-gray-400 text-sm">Активен</label>
        </div>
      </div>
      <div className="flex gap-3 pt-1">
        <button className="btn-primary" onClick={()=>onSave(f)}>Сохранить</button>
        <button className="btn-ghost" onClick={onCancel}>Отмена</button>
      </div>
    </div>
  );
};

const Doctors = () => {
  const [docs, setDocs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [show, setShow] = useState(false);
  const [editing, setEditing] = useState(null);

  const load = async () => { setLoading(true); const r=await api("/doctors"); setDocs(r.doctors); setLoading(false); };
  useEffect(()=>{load();},[]);

  const save = async (form) => {
    try {
      if(editing) await api(`/doctors/${editing.id}`,{method:"PUT",body:JSON.stringify(form)});
      else await api("/doctors",{method:"POST",body:JSON.stringify(form)});
      setShow(false); setEditing(null); load();
    } catch(e){alert(e.message);}
  };

  const remove = async (id) => {
    if(!confirm("Деактивировать врача?")) return;
    await api(`/doctors/${id}`,{method:"DELETE"}); load();
  };

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-white">Врачи</h1>
          <p className="text-gray-500 text-sm mt-0.5">{docs.length} специалистов</p>
        </div>
        <button className="btn-primary flex items-center gap-2" onClick={()=>{setEditing(null);setShow(true);}}>
          <Ico n="plus" s={15}/> Добавить
        </button>
      </div>

      {show && (
        <div className="glass-card p-5">
          <h2 className="text-white font-semibold mb-4">{editing?"Редактировать":"Новый врач"}</h2>
          <DoctorForm initial={editing} onSave={save} onCancel={()=>{setShow(false);setEditing(null);}}/>
        </div>
      )}

      {loading ? <Spinner/> : (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          {docs.map((d,i)=>(
            <div key={d.id} className={`doctor-card p-5 ${!d.is_active?"opacity-40":""}`}>
              <div className="flex items-start justify-between mb-4">
                <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${SPEC_COLORS[i%SPEC_COLORS.length]} to-transparent bg-opacity-20 border border-white/10 flex items-center justify-center`}>
                  <span className="text-white font-bold text-sm">{d.full_name[0]}</span>
                </div>
                <div className="flex gap-1">
                  <button onClick={()=>{setEditing(d);setShow(true);}}
                    className="w-7 h-7 rounded-lg bg-white/5 text-gray-500 hover:text-indigo-400 hover:bg-indigo-500/10 flex items-center justify-center transition-colors">
                    <Ico n="edit" s={13}/>
                  </button>
                  <button onClick={()=>remove(d.id)}
                    className="w-7 h-7 rounded-lg bg-white/5 text-gray-500 hover:text-red-400 hover:bg-red-500/10 flex items-center justify-center transition-colors">
                    <Ico n="trash" s={13}/>
                  </button>
                </div>
              </div>
              <h3 className="text-gray-200 font-semibold text-sm mb-0.5">{d.full_name}</h3>
              <p className="text-indigo-400 text-xs mb-3">{d.specialization_ru||d.specialization}</p>
              <div className="space-y-1.5 text-xs text-gray-500">
                <div className="flex items-center gap-2">
                  <Ico n="clock" s={12} cls="text-gray-600"/>
                  {d.work_start} — {d.work_end} · {d.slot_minutes} мин
                </div>
                {d.phone&&<div className="flex items-center gap-2"><Ico n="phone" s={12} cls="text-gray-600"/>{d.phone}</div>}
                <div className="flex items-center gap-1.5 mt-2">
                  <span className={`w-1.5 h-1.5 rounded-full ${d.is_active?"bg-emerald-500 pulse-dot":"bg-gray-600"}`}></span>
                  <span className={d.is_active?"text-emerald-500":"text-gray-600"}>{d.is_active?"Активен":"Деактивирован"}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// ── Calls ─────────────────────────────────────────────────────────────────────
const Calls = () => {
  const [calls, setCalls] = useState([]);
  const [total, setTotal] = useState(0);
  const [loading, setLoading] = useState(true);
  const [sf, setSf] = useState("");
  const [selected, setSelected] = useState(null);

  const load = useCallback(async()=>{
    setLoading(true);
    try { const r=await api(`/calls?limit=100${sf?`&status=${sf}`:""}`); setCalls(r.calls);setTotal(r.total); }
    finally{setLoading(false);}
  },[sf]);

  useEffect(()=>{load();},[load]);

  const dur = c => {
    if(!c.ended_at) return <span className="text-indigo-400 text-xs">Live</span>;
    const d=Math.round((new Date(c.ended_at)-new Date(c.started_at))/1000);
    return d<60?`${d}с`:`${Math.floor(d/60)}м ${d%60}с`;
  };

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-white">Звонки</h1>
          <p className="text-gray-500 text-sm mt-0.5">История: {total}</p>
        </div>
      </div>

      <div className="glass-card p-3">
        <div className="flex gap-2">
          {[["","Все"],["active","Активные"],["completed","Завершённые"],["transfer","Оператор"],["failed","Ошибки"]].map(([v,l])=>(
            <button key={v} onClick={()=>setSf(v)}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${sf===v?"bg-indigo-500/20 text-indigo-400":"text-gray-500 hover:text-gray-300 hover:bg-white/5"}`}>
              {l}
            </button>
          ))}
        </div>
      </div>

      <div className="glass-card overflow-hidden">
        <table className="w-full data-table">
          <thead><tr>
            {["Телефон","Пациент","Время","Длит.","Язык","Статус",""].map(h=>(
              <th key={h} className="p-4 text-left font-medium">{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {loading
              ? <tr><td colSpan={7} className="py-12 text-center"><Spinner/></td></tr>
              : calls.map(c=>(
                <tr key={c.id} className="cursor-pointer" onClick={()=>setSelected(c)}>
                  <td className="p-4 font-mono text-gray-300 text-sm">{c.phone}</td>
                  <td className="p-4 text-sm">{c.patients?.full_name||<span className="text-gray-600">—</span>}</td>
                  <td className="p-4 text-sm">{fmtDate(c.started_at)}</td>
                  <td className="p-4 text-sm">{dur(c)}</td>
                  <td className="p-4 text-sm uppercase">{c.language||"—"}</td>
                  <td className="p-4"><Badge status={c.status}/></td>
                  <td className="p-4"><Ico n="chevron" s={14} cls="text-gray-700"/></td>
                </tr>
              ))
            }
            {!loading&&!calls.length&&(
              <tr><td colSpan={7} className="p-12 text-center text-gray-600">Нет данных</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {selected&&(
        <Modal title={`Звонок · ${selected.phone}`} onClose={()=>setSelected(null)}>
          <div className="space-y-1 mb-5">
            <InfoRow label="Статус" value={<Badge status={selected.status}/>}/>
            <InfoRow label="Язык" value={(selected.language||"—").toUpperCase()}/>
            <InfoRow label="Состояние" value={<code className="bg-white/5 text-indigo-300 px-2 py-0.5 rounded text-xs">{selected.state||"—"}</code>}/>
            <InfoRow label="Начало" value={new Date(selected.started_at).toLocaleString("ru")}/>
            {selected.ended_at&&<InfoRow label="Конец" value={new Date(selected.ended_at).toLocaleString("ru")}/>}
          </div>
          {selected.context&&Object.keys(selected.context).length>0&&(
            <>
              <p className="text-gray-500 text-xs mb-2 uppercase tracking-wider">Контекст разговора</p>
              <pre className="bg-black/30 rounded-xl p-4 text-xs text-gray-400 overflow-auto border border-white/5">
                {JSON.stringify(selected.context,null,2)}
              </pre>
            </>
          )}
        </Modal>
      )}
    </div>
  );
};

// ── Settings ──────────────────────────────────────────────────────────────────
const Settings = () => {
  const [status, setStatus] = useState(null);
  useEffect(()=>{ fetch("/health").then(r=>r.json()).then(setStatus).catch(()=>setStatus({status:"error"})); },[]);

  return (
    <div className="fade-in space-y-5">
      <h1 className="text-2xl font-bold text-white">Настройки</h1>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div className="glass-card p-5">
          <h2 className="text-white font-semibold mb-4">Статус системы</h2>
          <div className="space-y-3">
            <div className="flex items-center justify-between p-3 rounded-xl bg-emerald-500/5 border border-emerald-500/10">
              <span className="text-gray-400 text-sm">API сервер</span>
              <div className="flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${status?.status==="ok"?"bg-emerald-500 pulse-dot":"bg-red-500"}`}></span>
                <span className={`text-sm font-medium ${status?.status==="ok"?"text-emerald-400":"text-red-400"}`}>
                  {status?.status==="ok"?"Онлайн":status?"Ошибка":"Проверка..."}
                </span>
              </div>
            </div>
            {[["База данных","Supabase PostgreSQL","emerald"],["Голос","Twilio Voice API","emerald"],["Сервер","Railway Cloud","emerald"]].map(([l,v,c])=>(
              <div key={l} className="flex items-center justify-between p-3 rounded-xl bg-white/2">
                <span className="text-gray-500 text-sm">{l}</span>
                <span className={`text-${c}-400 text-sm font-medium`}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="glass-card p-5">
          <h2 className="text-white font-semibold mb-4">Конфигурация</h2>
          <p className="text-gray-500 text-sm mb-4">Для изменения настроек отредактируйте <code className="bg-white/5 text-indigo-300 px-1.5 py-0.5 rounded">.env</code> на сервере.</p>
          <div className="space-y-2">
            {["SUPABASE_URL","SUPABASE_SERVICE_KEY","SERVER_URL","REMINDER_HOUR","CLINIC_NAME"].map(k=>(
              <div key={k} className="flex items-center justify-between p-2.5 rounded-lg bg-black/20 border border-white/5">
                <code className="text-xs text-gray-400">{k}</code>
                <span className="text-gray-600 text-xs tracking-widest">••••••</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Sidebar ───────────────────────────────────────────────────────────────────
const NAV=[
  {id:"dashboard",l:"Дашборд",n:"dashboard"},
  {id:"appointments",l:"Записи",n:"calendar"},
  {id:"patients",l:"Пациенты",n:"patients"},
  {id:"doctors",l:"Врачи",n:"doctors"},
  {id:"calls",l:"Звонки",n:"phone"},
  {id:"settings",l:"Настройки",n:"settings"},
];

const Sidebar = ({ active, onChange }) => (
  <aside className="sidebar w-56 h-screen flex flex-col fixed left-0 top-0 z-10">
    <div className="p-5 mb-2">
      <div className="flex items-center gap-3">
        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center logo-glow">
          <span className="text-white font-bold text-sm">M</span>
        </div>
        <div>
          <p className="text-white font-semibold text-sm">MedClinic</p>
          <p className="text-gray-600 text-xs">AI Ассистент</p>
        </div>
      </div>
    </div>

    <nav className="flex-1 px-3 space-y-0.5">
      {NAV.map(n=>(
        <button key={n.id}
          className={`nav-item w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium transition-all ${active===n.id?"active":""}`}
          onClick={()=>onChange(n.id)}>
          <Ico n={n.n} s={17}/>
          {n.l}
        </button>
      ))}
    </nav>

    <div className="p-4 border-t border-white/5">
      <div className="flex items-center gap-2.5">
        <span className="w-2 h-2 bg-emerald-500 rounded-full pulse-dot"></span>
        <span className="text-gray-600 text-xs">Система работает</span>
      </div>
    </div>
  </aside>
);

// ── App ───────────────────────────────────────────────────────────────────────
const PAGES = { dashboard:<Dashboard/>, appointments:<Appointments/>, patients:<Patients/>, doctors:<Doctors/>, calls:<Calls/>, settings:<Settings/> };

const App = () => {
  const [page, setPage] = useState("dashboard");
  return (
    <div className="flex min-h-screen">
      <Sidebar active={page} onChange={setPage}/>
      <main className="flex-1 ml-56 min-h-screen overflow-y-auto p-6">
        {PAGES[page]}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
